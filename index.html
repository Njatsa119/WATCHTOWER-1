<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Watchtower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <div class="status-bar">
        <div class="status-left">
          <span>4G</span>
          <span class="bars">▤</span>
        </div>
        <div class="status-right">
          <span>◔</span>
          <span>◍</span>
          <span class="battery"><i></i></span>
        </div>
      </div>

      <main class="app">
        <header class="topbar">
          <div class="profile-dot"></div>
          <div class="segmented">
            <button class="segment active">Exchange</button>
            <button class="segment">Wallet</button>
          </div>
          <div class="top-icons">
            <span>◌</span>
            <span>◍</span>
          </div>
        </header>

        <section class="portfolio-card">
          <div class="portfolio-head">
            <span class="muted">Est. Total Value(USD)</span>
            <button class="funds-btn">Add Funds</button>
          </div>
          <div class="portfolio-amount">
            <span class="currency">$</span><span id="totalValue">0.00</span>
          </div>
          <div class="portfolio-pnl">
            <span>Today's PNL</span>
            <span class="pnl-text" id="pnlValue">+$0.00</span>
          </div>

          <div class="quick-actions">
            <button class="action-item"><span class="icon">⇄</span><span>Convert</span></button>
            <button class="action-item"><span class="icon">◫</span><span>Alpha Events</span></button>
            <button class="action-item"><span class="icon">⌁</span><span>Learn & Earn</span></button>
            <button class="action-item"><span class="icon">◉</span><span>P2P</span></button>
          </div>
        </section>

        <section class="promo-banner">
          <div class="promo-left">
            <div class="promo-crown">♛</div>
            <span>Share $4M worth of Rewards</span>
          </div>
          <button class="promo-btn">Join</button>
        </section>

        <nav class="market-tabs" aria-label="Market categories">
          <button class="market-tab active">Hot</button>
          <button class="market-tab">TradFi</button>
          <button class="market-tab">Favorites</button>
          <button class="market-tab">Alpha</button>
          <button class="market-tab">New</button>
          <button class="market-tab">Gainers</button>
        </nav>

        <div class="watchlist-header">
          <span>Name</span>
          <span>Last Price</span>
          <span>Change(%)</span>
        </div>

        <div id="watchlist" class="watchlist"></div>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active"><span class="icon">⌂</span><span>Home</span></button>
        <button class="nav-item"><span class="icon">▣</span><span>Markets</span></button>
        <button class="nav-item"><span class="icon">⇄</span><span>Trade</span></button>
        <button class="nav-item"><span class="icon">◫</span><span>Futures</span></button>
        <button class="nav-item"><span class="icon">◈</span><span>Assets</span></button>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
